<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panco · O Cadeado da Qualidade</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{--red:#d54636;--navy:#002b89;--yel:#ffe536;--card:#fff;--ink:#0d1b4d;--mut:#5a6590;--line:#dfe5f5;--soft:#f1f4fc;--ok:#18a05a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#101c4f;--ink:#f1f4ff;--mut:#a9b5e0;--line:#27377a;--soft:#0a1440}}
:root[data-theme="dark"]{--card:#101c4f;--ink:#f1f4ff;--mut:#a9b5e0;--line:#27377a;--soft:#0a1440}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;
background:radial-gradient(120% 60% at 50% -10%,#1a4fd0 0%,rgba(26,79,208,0) 60%),linear-gradient(180deg,#00206b 0%,#001245 100%);background-attachment:fixed;overflow-x:hidden}
.bub{position:fixed;border-radius:50%;opacity:.9;animation:fl 9s ease-in-out infinite;z-index:0;pointer-events:none}
.b1{width:120px;height:120px;background:var(--red);top:6%;right:-30px}
.b2{width:70px;height:70px;background:var(--yel);top:38%;left:-22px;animation-delay:-3s}
.b3{width:90px;height:90px;background:#1a4fd0;bottom:8%;right:-26px;animation-delay:-6s}
.b4{width:46px;height:46px;background:var(--red);bottom:22%;left:14px;animation-delay:-2s;opacity:.7}
@keyframes fl{50%{transform:translateY(-22px) scale(1.06)}}
main{position:relative;z-index:1;width:100%;max-width:480px;padding:16px 16px 34px}
h1,.fr{font-family:"Fredoka",system-ui,sans-serif}
.hero{text-align:center;color:#fff}
.logo{display:block;margin:6px auto 0;height:170px;width:auto;max-width:100%;background:#fff;border-radius:28px;padding:8px;box-shadow:0 14px 40px rgba(0,0,0,.35);animation:rise .7s both}
.chip{display:inline-block;margin-top:16px;background:var(--yel);color:#0d1b4d;font-weight:800;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;padding:6px 14px;border-radius:99px}
h1{font-size:38px;line-height:1.02;margin:12px 0 6px;font-weight:700;text-shadow:0 3px 0 rgba(0,0,0,.2)}
h1 em{font-style:normal;color:var(--yel)}
.sub{opacity:.85;font-size:15px;margin:0 8px 6px}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:24px;padding:18px;margin:14px 0;box-shadow:0 16px 40px rgba(0,0,0,.28);animation:rise .5s both}
.rules{display:grid;gap:10px;margin:0}
.rule{display:flex;gap:12px;align-items:center;font-size:14.5px;line-height:1.35;color:var(--ink)}
.rule b.n{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:"Fredoka",sans-serif;font-size:17px}
.rule:nth-child(1) b.n{background:var(--red)}.rule:nth-child(2) b.n{background:var(--navy);}.rule:nth-child(3) b.n{background:var(--yel);color:#0d1b4d}.rule:nth-child(4) b.n{background:var(--ok)}
input.t{width:100%;padding:15px 16px;border-radius:16px;border:2px solid var(--line);background:var(--soft);color:var(--ink);font-size:18px;font-weight:600;outline:0}
input.t:focus{border-color:var(--navy)}
button{font:inherit}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:17px;font-family:"Fredoka",sans-serif;font-weight:700;font-size:20px;letter-spacing:.3px;color:#fff;background:linear-gradient(180deg,#e2594a,#c63a2a);box-shadow:0 6px 0 #962518,0 12px 22px rgba(0,0,0,.3);cursor:pointer;margin-top:16px;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #962518}
.btn.y{background:linear-gradient(180deg,#fff06a,#ffd91a);color:#0d1b4d;box-shadow:0 6px 0 #c9a600,0 12px 22px rgba(0,0,0,.3)}
.btn.y:active{box-shadow:0 1px 0 #c9a600}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#fff;margin-top:4px}
.team{font-weight:700;font-size:14px;background:rgba(255,255,255,.14);padding:7px 12px;border-radius:99px;max-width:58%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer{font-family:"Fredoka",sans-serif;font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;background:var(--yel);color:#0d1b4d;padding:5px 14px;border-radius:99px;box-shadow:0 4px 0 #c9a600}
.slots{display:flex;gap:7px;justify-content:center;margin:16px 0 4px}
.slot{width:46px;height:46px;border-radius:50%;border:2px dashed rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-family:"Fredoka",sans-serif;font-size:24px;font-weight:700;color:rgba(255,255,255,.6);transition:.3s}
.slot.on{border:0;color:#fff;box-shadow:0 5px 14px rgba(0,0,0,.35);animation:pop .5s}
.slot.c0{background:var(--red)}.slot.c1{background:#1a4fd0}.slot.c2{background:var(--yel);color:#0d1b4d}
@keyframes pop{0%{transform:scale(.3) rotate(-30deg)}65%{transform:scale(1.25)}100%{transform:none}}
.prog{height:8px;border-radius:9px;background:rgba(255,255,255,.18);margin:12px 4px 0;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--yel),#fff);border-radius:9px;transition:width .5s}
.st{display:flex;align-items:center;gap:10px;margin-bottom:10px;color:var(--mut);font-weight:700;font-size:13px;letter-spacing:.5px;text-transform:uppercase}
.st span{background:var(--navy);color:#fff;border-radius:99px;padding:4px 10px;font-size:12px}
.q{font-family:"Fredoka",sans-serif;font-size:20px;line-height:1.25;font-weight:600;margin:0 0 6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--soft);color:var(--ink);border:2px solid var(--line);border-radius:18px;padding:12px;margin:10px 0 0;cursor:pointer;line-height:1.35;font-size:15px;transition:transform .12s,border-color .12s;animation:rise .4s both}
.opt:active{transform:scale(.97);border-color:var(--navy)}
.opt .l{flex:none;width:30px;height:30px;border-radius:10px;background:var(--navy);color:#fff;font-family:"Fredoka",sans-serif;font-weight:700;display:flex;align-items:center;justify-content:center}
.opt.bad{border-color:var(--red);background:rgba(213,70,54,.12);animation:shake .4s;opacity:.6}
.opt.bad .l{background:var(--red)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.msg{min-height:20px;font-weight:700;text-align:center;color:var(--red);font-size:14px;margin-top:10px}
.center{text-align:center}
.bigd{width:150px;height:150px;border-radius:50%;margin:8px auto;display:flex;align-items:center;justify-content:center;font-family:"Fredoka",sans-serif;font-size:96px;font-weight:700;color:#fff;box-shadow:0 12px 30px rgba(0,0,0,.35);animation:pop .7s}
.ok{color:var(--ok);font-family:"Fredoka",sans-serif;font-size:24px;font-weight:700;margin:0}
.codes{display:flex;gap:7px;justify-content:center;margin:16px 0 4px}
.codes input{width:46px;height:58px;text-align:center;font-family:"Fredoka",sans-serif;font-size:26px;font-weight:700;border-radius:14px;border:2px solid var(--line);background:var(--soft);color:var(--ink);padding:0;outline:0}
.codes input:focus{border-color:var(--navy);transform:translateY(-3px)}
.lock{width:120px;height:120px;display:block;margin:0 auto}
.lock .sh{transition:transform .8s cubic-bezier(.3,1.6,.5,1);transform-origin:70px 52px}
.lock.open .sh{transform:translateY(-12px) rotate(-38deg)}
.time{font-family:"Fredoka",sans-serif;font-size:60px;font-weight:700;color:var(--navy);line-height:1;margin:2px 0}
:root[data-theme="dark"] .time{color:var(--yel)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .time{color:var(--yel)}}
.lab{color:var(--mut);font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin:12px 0 2px}
.tn{font-family:"Fredoka",sans-serif;font-size:28px;font-weight:700;margin:0}
.slogan{color:#fff;text-align:center;font-family:"Fredoka",sans-serif;font-size:20px;font-weight:600;margin:16px 0 0}
.toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:9;background:var(--red);color:#fff;font-family:"Fredoka",sans-serif;font-weight:700;font-size:30px;padding:8px 22px;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:tst 1.1s forwards;pointer-events:none}
@keyframes tst{0%{opacity:0;transform:translate(-50%,20px) scale(.7)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-50px)}}
.cf{position:fixed;top:-12px;z-index:9;width:10px;height:14px;border-radius:3px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(720deg);opacity:.9}}
</style>
</head>
<body>
<i class="bub b1"></i><i class="bub b2"></i><i class="bub b3"></i><i class="bub b4"></i>

var Q=[
{t:"Estação 1 · Temperatura",q:"Você nota que a câmara fria passou do limite de temperatura, mas ninguém viu. O que você faz?",o:["Ajusta o termostato e segue, sem registrar","Registra o valor real, comunica o desvio e segue o procedimento para o produto afetado","Registra o valor já corrigido, para o registro ficar “dentro do limite”","Comunica o desvio só se o produto parecer alterado"],c:1,d:3},
{t:"Estação 2 · Resultado de análise",q:"Numa análise de laboratório, o resultado de uma amostra sai fora da especificação. Ninguém acompanhou e repetir atrasaria o laudo. O que você faz?",o:["Repete a análise até dar um resultado dentro do limite e registra só esse","Registra o resultado obtido, comunica o desvio e segue o procedimento de investigação","Descarta o resultado e usa a média das análises anteriores","Libera o lote e avisa depois, para não atrasar a entrega"],c:1,d:8},
{t:"Estação 3 · Higienização",q:"Você vê um colega pulando a higienização das mãos porque a fila estava longa. O que você faz?",o:["Espera o líder passar por perto para ver se ele percebe","Conversa com ele na hora, com respeito, e comunica ao líder se repetir","Faz um comentário de brincadeira na frente de todos","Nada: cada um é responsável pelo que faz"],c:1,d:5},
{t:"Estação 4 · Dúvida no procedimento",q:"Você não entendeu uma etapa do procedimento e tem vergonha de perguntar. O que faz?",o:["Pergunta ao responsável antes de continuar","Pergunta a um colega experiente e segue o que ele disser, sem conferir no procedimento","Segue o que acha mais lógico e pergunta depois, se der problema","Observa como outra pessoa faz e repete"],c:0,d:1},
{t:"Estação 5 · Recebimento",q:"Chega uma matéria-prima com o laudo do fornecedor em ordem, mas a embalagem está amassada e o caminhão está atrasado. Ninguém está conferindo. O que você faz?",o:["Aceita, pois o laudo está em ordem e o fornecedor é confiável","Aceita e registra a observação, para avisar o fornecedor depois","Recusa o lote sem registrar, para evitar burocracia","Segue o procedimento de recebimento: inspeciona, registra a não conformidade e segrega para decisão"],c:3,d:9},
{t:"Estação 6 · Calibração",q:"Você percebe que um termômetro de uso na qualidade está com a calibração vencida há alguns dias, mas as leituras parecem normais. O que faz?",o:["Continua usando, pois as leituras parecem corretas","Compara com outro termômetro e, se bater, segue usando sem registrar","Retira o instrumento de uso, comunica e avalia o impacto das medições feitas","Espera a próxima auditoria para tratar o assunto"],c:2,d:6}
];

function fmt(s){var m=Math.floor(s/60),r=Math.floor(s%60);return (m<10?"0":"")+m+":"+(r<10?"0":"")+r}
function elapsed(){return S.done?S.done:(Date.now()-S.start)/1000+S.pen}
function esc(s){return s.replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function head(){return '<div class="top"><span class="team">'+esc(S.team)+'</span><span class="timer" id="tm">'+fmt(elapsed())+'</span></div>'}
function slots(){var h='<div class="slots">';for(var k=0;k<N;k++){var on=S.digits[k]!==undefined;h+='<div class="slot'+(on?' on c'+(k%3):'')+'">'+(on?S.digits[k]:'?')+'</div>'}return h+'</div>'}
function startTimer(){clearInterval(tick);tick=setInterval(function(){var e=document.getElementById("tm");if(e&&!S.done)e.textContent=fmt(elapsed())},500)}
function confetti(n){var c=["#d54636","#ffe536","#ffffff","#1a4fd0","#18a05a"];for(var i=0;i<n;i++){var d=document.createElement("i");d.className="cf";d.style.left=Math.random()*100+"vw";d.style.background=c[i%5];d.style.setProperty("--dx",(Math.random()*140-70)+"px");d.style.animationDuration=(1.6+Math.random()*1.6)+"s";d.style.animationDelay=Math.random()*.4+"s";document.body.appendChild(d);setTimeout(function(x){x.remove()},3800,d)}}
function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},1200)}
function padlock(open){return '<svg class="lock'+(open?' open':'')+'" viewBox="0 0 140 140"><g class="sh"><path d="M42 62V46a28 28 0 0 1 56 0v16" fill="none" stroke="#e6ebf7" stroke-width="12" stroke-linecap="round"/></g><rect x="26" y="58" width="88" height="68" rx="16" fill="#ffe536"/><rect x="26" y="58" width="88" height="68" rx="16" fill="none" stroke="#c9a600" stroke-width="4"/><circle cx="70" cy="88" r="9" fill="#002b89"/><rect x="66" y="92" width="8" height="18" rx="4" fill="#002b89"/></svg>'}
function render(){
 if(S.screen==="start"){
  app.innerHTML='<div class="hero"><img class="logo" alt="Panco agradece" src="'+LOGO+'"><span class="chip">Radar da Qualidade</span><h1>O Cadeado da <em>Qualidade</em></h1><p class="sub">Respeito às regras, mesmo quando ninguém está fiscalizando.</p></div>'+
  '<div class="card"><div class="rules">'+
  '<div class="rule"><b class="n">1</b><span>Responda as '+N+' situações. Cada acerto revela um número da senha.</span></div>'+
  '<div class="rule"><b class="n">2</b><span>Todas as opções parecem boas, mas só uma é a atitude certa.</span></div>'+
  '<div class="rule"><b class="n">3</b><span>Resposta errada custa <b>+'+PEN+' segundos</b>.</span></div>'+
  '<div class="rule"><b class="n">4</b><span>Monte a senha, abra o cadeado e vença com o menor tempo!</span></div></div>'+
  '<input class="t" id="team" maxlength="24" placeholder="Nome da sua equipe" autocomplete="off" style="margin-top:16px">'+
  '<button class="btn" id="go">Começar o desafio</button></div>';
  document.getElementById("go").onclick=function(){var v=document.getElementById("team").value.trim();if(!v){document.getElementById("team").focus();return}
   S.team=v;S.screen="quiz";S.i=0;S.digits=[];S.pen=0;S.done=0;S.start=Date.now();S.order=shuffle([0,1,2,3]);S.bad=[];render();startTimer()};
 }else if(S.screen==="quiz"){
  var q=Q[S.i],h=head()+slots()+'<div class="prog"><i style="width:'+(S.i/N*100)+'%"></i></div><div class="card"><div class="st"><span>'+(S.i+1)+' de '+N+'</span>'+q.t.split(" · ")[1]+'</div><p class="q">'+q.q+'</p>';
  S.order.forEach(function(idx,p){var b=S.bad.indexOf(idx)>=0;h+='<button class="opt'+(b?' bad':'')+'"'+(b?' disabled':'')+' data-i="'+idx+'" style="animation-delay:'+(p*.06)+'s"><span class="l">'+L[p]+'</span><span>'+q.o[idx]+'</span></button>'});
  h+='<div class="msg">'+(S.bad.length?'Ops! Releia: qual atitude você teria sem ninguém olhando?':'')+'</div></div>';
  app.innerHTML=h;
  [].forEach.call(app.querySelectorAll(".opt"),function(b){b.onclick=function(){answer(+b.dataset.i)}});
 }else if(S.screen==="reveal"){
  app.innerHTML=head()+slots()+'<div class="prog"><i style="width:'+((S.i+1)/N*100)+'%"></i></div><div class="card center"><p class="ok">Resposta certa!</p><p class="lab">Número da senha</p><div class="bigd c'+(S.i%3)+'" style="background:'+['#d54636','#1a4fd0','#ffe536'][S.i%3]+';'+(S.i%3==2?'color:#0d1b4d':'')+'">'+Q[S.i].d+'</div><button class="btn y" id="nx">'+(S.i<N-1?'Próxima estação':'Ir para o cadeado')+'</button></div>';
  confetti(36);
  document.getElementById("nx").onclick=function(){if(S.i<N-1){S.i++;S.order=shuffle([0,1,2,3]);S.bad=[];S.screen="quiz"}else{S.screen="lock"}render()};
 }else if(S.screen==="lock"){
  var inp="";for(var k=0;k<N;k++)inp+='<input inputmode="numeric" maxlength="1">';
  app.innerHTML=head()+slots()+'<div class="card center">'+padlock(false)+'<p class="tn">Hora de abrir!</p><p class="sub" style="color:var(--mut)">Digite a senha na ordem das estações.</p><div class="codes">'+inp+'</div><div class="msg" id="lm"></div><button class="btn" id="op">Abrir cadeado</button></div>';
  var ins=app.querySelectorAll(".codes input");ins[0].focus();
  [].forEach.call(ins,function(el,k){el.oninput=function(){el.value=el.value.replace(/\D/g,"");if(el.value&&ins[k+1])ins[k+1].focus()};el.onkeydown=function(e){if(e.key==="Backspace"&&!el.value&&ins[k-1])ins[k-1].focus()}});
  document.getElementById("op").onclick=function(){var v="";[].forEach.call(ins,function(e){v+=e.value});var m=document.getElementById("lm");
   if(v===CODE){S.done=elapsed();S.screen="win";render()}else{S.pen+=PEN;toast("+"+PEN+"s");m.textContent="Senha incorreta!";[].forEach.call(ins,function(e){e.value=""});ins[0].focus()}};
 }else{
  app.innerHTML='<div class="hero"><img class="logo" style="height:110px" alt="Panco agradece" src="'+LOGO+'"></div><div class="card center">'+padlock(false)+'<h1 style="color:var(--ink);font-size:34px;text-shadow:none;margin:8px 0">Cadeado <em style="color:var(--red)">aberto!</em></h1><p class="lab">Equipe</p><p class="tn">'+esc(S.team)+'</p><p class="lab">Tempo final</p><div class="time">'+fmt(S.done)+'</div><p class="sub" style="color:var(--mut);margin-top:14px">Mostre esta tela ao apresentador.</p></div><p class="slogan">Qualidade é fazer o certo, sempre!</p>';
  setTimeout(function(){var l=document.querySelector(".lock");if(l)l.classList.add("open")},250);confetti(90);setTimeout(function(){confetti(60)},900);
 }
}
function answer(idx){
 if(idx===Q[S.i].c){S.digits[S.i]=Q[S.i].d;S.screen="reveal";S.bad=[]}else{S.pen+=PEN;S.bad.push(idx);toast("+"+PEN+"s")}
 render();
}
render();
</script>
</body>
</html>
